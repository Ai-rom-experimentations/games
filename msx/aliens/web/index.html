<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ALIENS! - an MSX1 game in your browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="ALIENS!, a Galaga-style MSX1 cartridge, running on the blueMSX libretro core compiled to WebAssembly.">
<style>
  :root {
    --ink: #f4f1e8;
    --dim: #8d8aa0;
    --gold: #ffd23f;
    --red: #ff5b5b;
    --cyan: #7fe7ff;
    --panel: #14141f;
    --line: #262636;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #07070c;
    color: var(--ink);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(127, 231, 255, .10), transparent 60%),
      radial-gradient(900px 420px at 90% 0%, rgba(255, 210, 63, .08), transparent 60%),
      #07070c;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    flex-wrap: wrap;
    padding: .8rem clamp(.75rem, 3vw, 1.5rem);
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.05rem, 3.5vw, 1.45rem);
    letter-spacing: .22em;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(255, 210, 63, .35);
  }
  header p { margin: 0; color: var(--dim); font-size: .78rem; letter-spacing: .04em; }
  header .spacer { flex: 1 1 auto; }
  header a { color: var(--cyan); text-decoration: none; font-size: .78rem; }
  header a:hover { text-decoration: underline; }

  main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .7rem;
    padding: .7rem clamp(.5rem, 3vw, 1.5rem) .4rem;
    min-height: 0;
  }

  #screen {
    position: relative;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255, 255, 255, .02) inset;
    overflow: hidden;
    line-height: 0;
    max-width: 100%;
  }
  #vdp {
    display: block;
    width: min(100%, calc((100dvh - 20rem) * 1.1333));
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    touch-action: none;
  }
  /* a very light CRT-ish texture, cheap enough for a tablet */
  #screen::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    opacity: .5;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9rem;
    text-align: center;
    padding: 1rem;
    background: rgba(5, 5, 10, .82);
    backdrop-filter: blur(2px);
    line-height: 1.5;
    transition: opacity .25s ease;
  }
  #overlay[hidden] { display: none; }
  #overlay h2 { margin: 0; font-size: clamp(1rem, 4vw, 1.4rem); letter-spacing: .2em; color: var(--gold); }
  #overlay p { margin: 0; max-width: 34rem; color: var(--dim); font-size: .82rem; }
  #overlay.busy h2::after { content: "…"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #start {
    font: inherit;
    font-size: 1rem;
    letter-spacing: .16em;
    padding: .7rem 1.6rem;
    color: #14140c;
    background: var(--gold);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 210, 63, .25);
  }
  #start:active { transform: translateY(1px); }
  #start[hidden] { display: none; }

  #bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .45rem;
    width: 100%;
    max-width: 60rem;
  }
  #bar button {
    font: inherit;
    font-size: .8rem;
    letter-spacing: .06em;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .45rem .8rem;
    cursor: pointer;
    touch-action: manipulation;
  }
  #bar button:hover { border-color: #3a3a52; }
  #bar button[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }

  #pad { display: none; width: 100%; max-width: 34rem; }
  body.touch #pad {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .2rem 0 0;
  }
  .dpad {
    display: grid;
    grid-template: repeat(3, 3.1rem) / repeat(3, 3.1rem);
    gap: .3rem;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad button, .fire {
    font: inherit;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad button { font-size: 1.1rem; }
  .dpad button.on, .fire.on { background: #2b2b40; border-color: var(--gold); color: var(--gold); }
  .dpad .u { grid-area: 1 / 2; }
  .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; }
  .dpad .d { grid-area: 3 / 2; }
  .fire {
    width: 6.6rem;
    height: 6.6rem;
    border-radius: 50%;
    font-size: .82rem;
    letter-spacing: .12em;
    background: radial-gradient(circle at 35% 30%, #3a2d33, #1a1620);
    border-color: #4a3a3f;
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem .9rem;
    justify-content: center;
    padding: .5rem clamp(.75rem, 3vw, 1.5rem) calc(.6rem + env(safe-area-inset-bottom));
    color: var(--dim);
    font-size: .7rem;
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--dim); }
  footer strong { color: #b9b6c8; font-weight: normal; }

  #error {
    margin: .4rem auto 0;
    max-width: 60rem;
    padding: .6rem .8rem;
    border: 1px solid var(--red);
    border-radius: 8px;
    color: #ffd7d7;
    background: rgba(255, 91, 91, .08);
    font-size: .8rem;
    white-space: pre-wrap;
  }
  #error[hidden] { display: none; }

  /* "cinema" mode: no chrome, big picture (used when real fullscreen is not available) */
  body.cinema header, body.cinema footer, body.cinema #bar, body.cinema #hint { display: none; }
  body.cinema main { padding: 0; }
  body.cinema #screen { border: 0; border-radius: 0; }
  body.cinema #vdp { width: min(100vw, calc(100dvh * 1.1333)); }
</style>
</head>
<body>
<header>
  <h1>ALIENS!</h1>
  <p>MSX1 · blueMSX (libretro, WebAssembly) · C-BIOS</p>
  <span class="spacer"></span>
  <a href="../README.md">about the game</a>
</header>

<main>
  <div id="screen">
    <canvas id="vdp" width="272" height="240" aria-label="MSX screen"></canvas>
    <div id="overlay" class="busy">
      <h2>LOADING</h2>
      <p>Waking up an MSX1 with C-BIOS in it, and sliding the cartridge into slot 1.</p>
      <button id="start" hidden>TAP TO PLAY</button>
    </div>
  </div>

  <div id="pad">
    <div class="dpad">
      <button class="u" data-btn="4" aria-label="up">▲</button>
      <button class="l" data-btn="6" aria-label="left">◀</button>
      <button class="r" data-btn="7" aria-label="right">▶</button>
      <button class="d" data-btn="5" aria-label="down">▼</button>
    </div>
    <button class="fire" data-btn="8">FIRE</button>
  </div>

  <div id="bar">
    <button id="b-pause" aria-pressed="false">PAUSE</button>
    <button id="b-reset">RESET</button>
    <button id="b-sound" aria-pressed="true">SOUND</button>
    <button id="b-full">FULLSCREEN</button>
  </div>

  <div id="error" hidden></div>
</main>

<footer>
  <span><strong>arrows / WASD</strong> move · <strong>space / Z</strong> fire</span>
  <span>ROM: <a href="../aliens.rom">aliens.rom</a> (16 KB, md5 f3f7a449…)</span>
  <span>core: blueMSX-libretro → WebAssembly, C-BIOS for the BIOS</span>
</footer>

<script type="module" src="emulator.js"></script>
<noscript><p style="padding:1rem">This page needs JavaScript and WebAssembly.</p></noscript>
</body>
</html>
